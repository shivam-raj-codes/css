        body {
            background-color: #313131;
        }



        h1 {
            color: #fff;

            text-align: center;
            padding: 20px;
            margin: 20px;

        span {
            /* we can make inLine ele to a Block ele & vice - versa using CSS. */
            display: block;
            font-size: 60px;
            color: #fff;
            text-align: center;
            background-color: #e45016;
        }

        p {
            background-color: #fcf8f7;
            display: inline;
        }
    </style>
</head>

    <h1>Lorem ipsum dolor sit amet, consectetur adipisicing elit.</h1>
